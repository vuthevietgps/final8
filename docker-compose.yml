services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: final8-backend
    environment:
      NODE_ENV: production
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:-smarterp_dev_secret_key_change_in_prod}
      # MongoDB connection string; uses Atlas by default, can override with MONGODB_URI env var
      MONGODB_URI: ${MONGODB_URI:-mongodb+srv://dinhvigps07:zn0dOrNeZH2yx2yO@smarterp-dev.khsfdta.mongodb.net/management-system}
      # If using Google credentials, prefer GOOGLE_CREDENTIALS_JSON env; file mounting removed during cleanup
      # GOOGLE_CREDENTIALS_JSON: ${GOOGLE_CREDENTIALS_JSON:-}
      # Optional hint for our path resolver
      BACKEND_ROOT: /app
      MEDIA_DIR: /app/uploads/media
      MEDIA_PUBLIC_BASE: /media
      # Optional: enable FB sending + absolute media origin for image attachments
      FB_SENDING_ENABLED: "${FB_SENDING_ENABLED:-0}"
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-http://localhost:8080}"
      MEDIA_ABSOLUTE_BASE: "${MEDIA_ABSOLUTE_BASE:-http://localhost:8080}"
    volumes:
      # Persist uploads across rebuilds
      - ./backend/uploads:/app/uploads
      # Media shared storage
      - ./media:/app/uploads/media
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: final8-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./media:/var/www/media:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: final8-net
    driver: bridge

