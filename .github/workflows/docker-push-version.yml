name: Build & Push Docker images

on:
  workflow_dispatch:
    inputs:
      tag:
  description: "Image tag to build and push (e.g., version6, latest)"
        required: true
  default: "version6"

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          TAG=${{ github.event.inputs.tag }}
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "BACKEND_TAG=vutheviet/final8new:backend-$TAG" >> $GITHUB_OUTPUT
          echo "FRONTEND_TAG=vutheviet/final8new:frontend-$TAG" >> $GITHUB_OUTPUT

      - name: Build backend image
        id: build_backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.BACKEND_TAG }}
          platforms: linux/amd64
          cache-from: type=registry,ref=vutheviet/final8new:backend-${{ github.event.inputs.tag }}
          cache-to: type=inline

      - name: Build frontend image
        id: build_frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.FRONTEND_TAG }}
          platforms: linux/amd64
          cache-from: type=registry,ref=vutheviet/final8new:frontend-${{ github.event.inputs.tag }}
          cache-to: type=inline

      - name: Print image digests
        run: |
          echo "Backend image: ${{ steps.meta.outputs.BACKEND_TAG }}"
          echo "Frontend image: ${{ steps.meta.outputs.FRONTEND_TAG }}"
          echo "Backend digest:  ${{ steps.build_backend.outputs.digest }}"
          echo "Frontend digest: ${{ steps.build_frontend.outputs.digest }}"
          echo "Verify on server with:"
          echo "  docker manifest inspect ${{ steps.meta.outputs.BACKEND_TAG }} | jq -r '.manifests[0].digest'"
          echo "  docker manifest inspect ${{ steps.meta.outputs.FRONTEND_TAG }} | jq -r '.manifests[0].digest'"
