services:
  backend:
    image: vutheviet/final8new:backend-${VERSION:-latest}
    container_name: htxbachgia-shop-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET}
      API_TOKEN_SECRET: ${API_TOKEN_SECRET}
      FB_BUSINESS_ID: "${FB_BUSINESS_ID:-}"
      FB_SYSTEM_USER_SYNC_INTERVAL_MINUTES: "${FB_SYSTEM_USER_SYNC_INTERVAL_MINUTES:-10}"
      FB_TOKEN_REVALIDATE_INTERVAL_MINUTES: "${FB_TOKEN_REVALIDATE_INTERVAL_MINUTES:-10}"
      AI_MARKETING_REQUIRE_APPROVAL: "${AI_MARKETING_REQUIRE_APPROVAL:-true}"
      AI_MARKETING_DRY_RUN: "${AI_MARKETING_DRY_RUN:-true}"
      AI_MARKETING_PROVIDER_EXECUTION_ENABLED: "${AI_MARKETING_PROVIDER_EXECUTION_ENABLED:-false}"
      META_ADS_PRODUCTION_ENABLED: "${META_ADS_PRODUCTION_ENABLED:-false}"
      META_ADS_PROVIDER_EXECUTION_ENABLED: "${META_ADS_PROVIDER_EXECUTION_ENABLED:-false}"
      META_ADS_CAMPAIGN_CREATE_ENABLED: "${META_ADS_CAMPAIGN_CREATE_ENABLED:-false}"
      META_ADS_CAMPAIGN_UPDATE_ENABLED: "${META_ADS_CAMPAIGN_UPDATE_ENABLED:-false}"
      META_ADS_CAMPAIGN_PAUSE_ENABLED: "${META_ADS_CAMPAIGN_PAUSE_ENABLED:-false}"
      META_ADS_AD_SET_CREATE_ENABLED: "${META_ADS_AD_SET_CREATE_ENABLED:-false}"
      META_ADS_AD_SET_PAUSE_ENABLED: "${META_ADS_AD_SET_PAUSE_ENABLED:-false}"
      META_ADS_AD_CREATIVE_CREATE_ENABLED: "${META_ADS_AD_CREATIVE_CREATE_ENABLED:-false}"
      META_ADS_AD_CREATE_ENABLED: "${META_ADS_AD_CREATE_ENABLED:-false}"
      META_ADS_INTERNAL_MAPPING_VERIFIED_ENABLED: "${META_ADS_INTERNAL_MAPPING_VERIFIED_ENABLED:-false}"
      META_ADS_ACCOUNT_ID_ALLOWLIST: "${META_ADS_ACCOUNT_ID_ALLOWLIST:-}"
      META_ADS_LANDING_PAGE_ALLOWLIST: "${META_ADS_LANDING_PAGE_ALLOWLIST:-}"
      META_ADS_APP_STORE_HOST_ALLOWLIST: "${META_ADS_APP_STORE_HOST_ALLOWLIST:-}"
      META_ADS_PROVIDER_VALIDATION_TTL_MS: "${META_ADS_PROVIDER_VALIDATION_TTL_MS:-900000}"
      META_ADS_ACCOUNT_SYNC_MAX_AGE_MS: "${META_ADS_ACCOUNT_SYNC_MAX_AGE_MS:-1800000}"
      META_ADS_CREDENTIAL_MAX_AGE_MS: "${META_ADS_CREDENTIAL_MAX_AGE_MS:-1800000}"
      META_ADS_MUTATION_TIMEOUT_MS: "${META_ADS_MUTATION_TIMEOUT_MS:-30000}"
      META_ADS_FINANCIAL_LEASE_MS: "${META_ADS_FINANCIAL_LEASE_MS:-300000}"
      META_ADS_MAX_DAILY_BUDGET_VND: "${META_ADS_MAX_DAILY_BUDGET_VND:-5000000}"
      META_ADS_MAX_LIFETIME_BUDGET_VND: "${META_ADS_MAX_LIFETIME_BUDGET_VND:-150000000}"
      META_ADS_MAX_SPEND_CAP_VND: "${META_ADS_MAX_SPEND_CAP_VND:-150000000}"
      META_ADS_SPECIAL_CATEGORY_ALLOWLIST: "${META_ADS_SPECIAL_CATEGORY_ALLOWLIST:-NONE}"
      META_ADS_CAMPAIGN_SCHEDULE_MAX_DAYS: "${META_ADS_CAMPAIGN_SCHEDULE_MAX_DAYS:-365}"
      META_GRAPH_API_VERSION: "${META_GRAPH_API_VERSION:-v25.0}"
      GOOGLE_ADS_PRODUCTION_ENABLED: "${GOOGLE_ADS_PRODUCTION_ENABLED:-false}"
      GOOGLE_ADS_CAMPAIGN_CREATE_ENABLED: "${GOOGLE_ADS_CAMPAIGN_CREATE_ENABLED:-false}"
      GOOGLE_ADS_CAMPAIGN_UPDATE_ENABLED: "${GOOGLE_ADS_CAMPAIGN_UPDATE_ENABLED:-false}"
      GOOGLE_ADS_CAMPAIGN_BIDDING_UPDATE_ENABLED: "${GOOGLE_ADS_CAMPAIGN_BIDDING_UPDATE_ENABLED:-false}"
      GOOGLE_ADS_BIDDING_LIFECYCLE_BATCH_SIZE: "${GOOGLE_ADS_BIDDING_LIFECYCLE_BATCH_SIZE:-20}"
      GOOGLE_ADS_BIDDING_LIFECYCLE_LEASE_MS: "${GOOGLE_ADS_BIDDING_LIFECYCLE_LEASE_MS:-300000}"
      GOOGLE_ADS_BIDDING_METRICS_MAX_AGE_HOURS: "${GOOGLE_ADS_BIDDING_METRICS_MAX_AGE_HOURS:-48}"
      GOOGLE_ADS_MAX_TARGET_CPA_VND: "${GOOGLE_ADS_MAX_TARGET_CPA_VND:-100000000}"
      GOOGLE_ADS_CAMPAIGN_PAUSE_ENABLED: "${GOOGLE_ADS_CAMPAIGN_PAUSE_ENABLED:-false}"
      GOOGLE_ADS_CAMPAIGN_RESUME_ENABLED: "${GOOGLE_ADS_CAMPAIGN_RESUME_ENABLED:-false}"
      GOOGLE_ADS_AD_GROUP_CREATE_ENABLED: "${GOOGLE_ADS_AD_GROUP_CREATE_ENABLED:-false}"
      GOOGLE_ADS_AD_GROUP_UPDATE_ENABLED: "${GOOGLE_ADS_AD_GROUP_UPDATE_ENABLED:-false}"
      GOOGLE_ADS_AD_GROUP_PAUSE_ENABLED: "${GOOGLE_ADS_AD_GROUP_PAUSE_ENABLED:-false}"
      GOOGLE_ADS_AD_GROUP_RESUME_ENABLED: "${GOOGLE_ADS_AD_GROUP_RESUME_ENABLED:-false}"
      GOOGLE_ADS_KEYWORD_CREATE_ENABLED: "${GOOGLE_ADS_KEYWORD_CREATE_ENABLED:-false}"
      GOOGLE_ADS_KEYWORD_UPDATE_ENABLED: "${GOOGLE_ADS_KEYWORD_UPDATE_ENABLED:-false}"
      GOOGLE_ADS_KEYWORD_PAUSE_ENABLED: "${GOOGLE_ADS_KEYWORD_PAUSE_ENABLED:-false}"
      GOOGLE_ADS_KEYWORD_RESUME_ENABLED: "${GOOGLE_ADS_KEYWORD_RESUME_ENABLED:-false}"
      GOOGLE_ADS_RSA_CREATE_ENABLED: "${GOOGLE_ADS_RSA_CREATE_ENABLED:-false}"
      GOOGLE_ADS_RSA_UPDATE_ENABLED: "${GOOGLE_ADS_RSA_UPDATE_ENABLED:-false}"
      GOOGLE_ADS_RSA_PAUSE_ENABLED: "${GOOGLE_ADS_RSA_PAUSE_ENABLED:-false}"
      GOOGLE_ADS_RSA_RESUME_ENABLED: "${GOOGLE_ADS_RSA_RESUME_ENABLED:-false}"
      GOOGLE_ADS_CLIENT_ID: "${GOOGLE_ADS_CLIENT_ID:-}"
      GOOGLE_ADS_CLIENT_SECRET: "${GOOGLE_ADS_CLIENT_SECRET:-}"
      GOOGLE_ADS_REFRESH_TOKEN: "${GOOGLE_ADS_REFRESH_TOKEN:-}"
      GOOGLE_ADS_DEVELOPER_TOKEN: "${GOOGLE_ADS_DEVELOPER_TOKEN:-}"
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: "${GOOGLE_ADS_LOGIN_CUSTOMER_ID:-}"
      GOOGLE_ADS_API_VERSION: "${GOOGLE_ADS_API_VERSION:-v24}"
      GOOGLE_ADS_CUSTOMER_ID_ALLOWLIST: "${GOOGLE_ADS_CUSTOMER_ID_ALLOWLIST:-}"
      GOOGLE_ADS_LOGIN_CUSTOMER_ID_ALLOWLIST: "${GOOGLE_ADS_LOGIN_CUSTOMER_ID_ALLOWLIST:-}"
      GOOGLE_ADS_LANDING_PAGE_ALLOWLIST: "${GOOGLE_ADS_LANDING_PAGE_ALLOWLIST:-}"
      GOOGLE_ADS_TRACKING_DOMAIN_ALLOWLIST: "${GOOGLE_ADS_TRACKING_DOMAIN_ALLOWLIST:-}"
      GOOGLE_ADS_PROVIDER_VALIDATION_TTL_MS: "${GOOGLE_ADS_PROVIDER_VALIDATION_TTL_MS:-900000}"
      GOOGLE_ADS_VALIDATION_TIMEOUT_MS: "${GOOGLE_ADS_VALIDATION_TIMEOUT_MS:-30000}"
      GOOGLE_ADS_MUTATION_TIMEOUT_MS: "${GOOGLE_ADS_MUTATION_TIMEOUT_MS:-30000}"
      GOOGLE_ADS_CONNECTION_TEST_TIMEOUT_MS: "${GOOGLE_ADS_CONNECTION_TEST_TIMEOUT_MS:-30000}"
      GOOGLE_ADS_FINANCIAL_SYNC_MAX_AGE_MS: "${GOOGLE_ADS_FINANCIAL_SYNC_MAX_AGE_MS:-900000}"
      GOOGLE_ADS_MAX_CPC_BID_VND: "${GOOGLE_ADS_MAX_CPC_BID_VND:-1000000}"
      GOOGLE_ADS_MAX_CPC_BID_INCREASE_PERCENT: "${GOOGLE_ADS_MAX_CPC_BID_INCREASE_PERCENT:-20}"
      GOOGLE_ADS_CANONICAL_SYNC_MAX_AGE_MS: "${GOOGLE_ADS_CANONICAL_SYNC_MAX_AGE_MS:-900000}"
      ADS_MANAGER_PROVIDER_VERIFICATION_TTL_MINUTES: "${ADS_MANAGER_PROVIDER_VERIFICATION_TTL_MINUTES:-60}"
      ADS_AUTOMATION_DRAFTS_ENABLED: "${ADS_AUTOMATION_DRAFTS_ENABLED:-false}"
      ADS_AUTOMATION_ACTOR_USER_ID: "${ADS_AUTOMATION_ACTOR_USER_ID:-}"
      ADS_AUTOMATION_DRAFT_MAX_SNAPSHOT_AGE_MINUTES: "${ADS_AUTOMATION_DRAFT_MAX_SNAPSHOT_AGE_MINUTES:-1440}"
      ADS_EVIDENCE_QUERY_CONCURRENCY: "${ADS_EVIDENCE_QUERY_CONCURRENCY:-6}"
      ADS_EVIDENCE_ORDER_PAGE_SIZE: "${ADS_EVIDENCE_ORDER_PAGE_SIZE:-1000}"
      ADS_EVIDENCE_MAX_ORDER_ROWS: "${ADS_EVIDENCE_MAX_ORDER_ROWS:-50000}"
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: ${REDIS_URL:-}
      DB_READINESS_TIMEOUT_MS: "${DB_READINESS_TIMEOUT_MS:-3000}"
      BACKEND_ROOT: /app
      MEDIA_DIR: /app/uploads/media
      MEDIA_PUBLIC_BASE: /media
      FB_SENDING_ENABLED: "${FB_SENDING_ENABLED:-1}"
      AI_FB_SENDING_ENABLED: "${AI_FB_SENDING_ENABLED:-1}"
      AI_FB_DELIVERY_RECOVERY_ENABLED: "${AI_FB_DELIVERY_RECOVERY_ENABLED:-1}"
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-https://htxbachgia.shop}"
      MEDIA_ABSOLUTE_BASE: "${MEDIA_ABSOLUTE_BASE:-https://htxbachgia.shop}"
      MESSENGER_VERIFY_TOKEN: "${MESSENGER_VERIFY_TOKEN}"
      FB_VERIFY_TOKEN: "${FB_VERIFY_TOKEN:-${MESSENGER_VERIFY_TOKEN}}"
    volumes:
      - ./uploads:/app/uploads
      - ./media:/app/uploads/media
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - htxbachgia-net

  frontend:
    image: vutheviet/final8new:frontend-${VERSION:-latest}
    container_name: htxbachgia-shop-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PORT:-8090}:80"
    volumes:
      - ./media:/var/www/media:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - htxbachgia-net

networks:
  htxbachgia-net:
    driver: bridge
