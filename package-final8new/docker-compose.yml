services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: final8-backend
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Prefer JSON inline if you have it. Otherwise use GOOGLE_APPLICATION_CREDENTIALS below.
      # GOOGLE_CREDENTIALS_JSON: ${GOOGLE_CREDENTIALS_JSON:-}
      GOOGLE_APPLICATION_CREDENTIALS: /app/dongbodulieuweb-8de0c9a12896.json
      # Optional hint for our path resolver
      BACKEND_ROOT: /app
      MEDIA_DIR: /app/uploads/media
      MEDIA_PUBLIC_BASE: /media
    volumes:
      # Persist uploads across rebuilds
      - ./backend/uploads:/app/uploads
      # Mount service account credentials (read-only). Adjust file name if yours is different.
      - ./backend/dongbodulieuweb-8de0c9a12896.json:/app/dongbodulieuweb-8de0c9a12896.json:ro
      # Media shared storage
      - ./media:/app/uploads/media
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: final8-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./media:/var/www/media:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: final8-net
    driver: bridge
