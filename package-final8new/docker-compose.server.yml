# Server-only overrides to avoid conflicts with existing containers and ports
# - Frontend published on host port 8088
# - Backend kept internal (no host port published)
# - Unique container names to avoid colliding with any existing 'final8-*'
# - Separate network name
services:
  backend:
    container_name: final8new-backend
    # Remove any host port mapping and keep service internal to the docker network
    ports: []
    expose:
      - "3000"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    container_name: final8new-frontend
    ports:
      - "8088:80"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

networks:
  default:
    name: final8new-net
