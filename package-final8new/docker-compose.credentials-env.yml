# Use env-based Google credentials instead of mounting the JSON file.
# Keep uploads volume; do not publish extra ports here.
services:
  backend:
    environment:
      # Put the minified JSON content of your service account here via .env or shell
      # Example in .env: GOOGLE_CREDENTIALS_JSON={"type":"service_account",...}
      GOOGLE_CREDENTIALS_JSON: ${GOOGLE_CREDENTIALS_JSON:-}
      # Disable file-based credential in this override
      GOOGLE_APPLICATION_CREDENTIALS: ""
    # Re-declare volumes to drop the credential file mount but keep uploads
    volumes:
      - ./backend/uploads:/app/uploads
